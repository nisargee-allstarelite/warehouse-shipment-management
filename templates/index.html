<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Awaiting Shipment - Bucket Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e3e5e9;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #0f766e;
    --accent-light: #ccfbf1;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }
  h1 { font-size: 20px; margin: 0; }
  .stats {
    display: flex;
    gap: 24px;
    font-size: 14px;
    color: var(--muted);
  }
  .stats b { color: var(--text); font-size: 18px; display: block; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  input#search {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    width: 280px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  #status-line {
    font-size: 13px;
    color: var(--muted);
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 12px;
  }
  .bucket-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .bucket-card .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .bucket-name {
    font-weight: 600;
    font-size: 14px;
  }
  .bucket-count {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .bucket-detail {
    display: none;
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    max-height: 320px;
    overflow-y: auto;
  }
  .bucket-detail.open { display: block; }
  .select-all-row {
    padding: 4px 0 8px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .select-all-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .item-row {
    font-size: 12px;
    color: var(--muted);
    padding: 5px 0;
    border-bottom: 1px dashed var(--border);
    white-space: nowrap;
    overflow-x: auto;
    cursor: pointer;
  }
  .item-row:hover { color: var(--accent); }
  .item-row .field { color: var(--text); font-weight: 600; }
  .item-row .order-id { color: var(--muted); }
  .item-count { color: var(--muted); font-weight: 400; }
  .item-checkbox {
    margin-right: 8px;
    vertical-align: middle;
    cursor: pointer;
  }
  .action-row {
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .ship-btn {
    background: #b45309;
    font-size: 12px;
    padding: 6px 12px;
  }
  .ship-btn:disabled {
    background: #d1d5db;
    cursor: not-allowed;
  }
  .action-row button.secondary {
    font-size: 12px;
    padding: 6px 12px;
  }
  #empty {
    color: var(--muted);
    text-align: center;
    padding: 60px 0;
    display: none;
  }
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    max-width: 480px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  #modal-box h2 { margin: 0 0 12px 0; font-size: 16px; }
  #modal-box pre {
    white-space: pre-wrap;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    background: var(--bg);
    padding: 12px;
    border-radius: 8px;
    line-height: 1.6;
  }
  #modal-close {
    margin-top: 16px;
  }
  .ship-result-row {
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  .ship-result-row.success { color: #166534; }
  .ship-result-row.failure { color: #b91c1c; }
  .ship-result-row a {
    color: var(--accent);
    font-weight: 600;
  }
  #ship-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #ship-modal-overlay.open { display: flex; }
  #ship-modal-box {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    max-width: 560px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  #ship-modal-box h2 { margin: 0 0 12px 0; font-size: 16px; }
</style>
</head>
<body>

<header>
  <h1>Awaiting Shipment - Bucket Dashboard</h1>
  <div class="stats">
    <div><b id="stat-orders">-</b>orders</div>
    <div><b id="stat-buckets">-</b>buckets</div>
    <div><a href="/history" style="color:var(--muted); font-size:13px;">Shipping History</a></div>
    <div><a href="/logout" style="color:var(--muted); font-size:13px;">Log out</a></div>
  </div>
</header>

<div class="top-bar">
  <input id="search" placeholder="Search buckets (e.g. Jersey, Bones)..." oninput="renderBuckets()">
  <div>
    <span id="status-line">Loading...</span>
    <button class="secondary" onclick="refreshNow()">Refresh now</button>
  </div>
</div>

<div id="grid"></div>
<div id="empty">No buckets match your search.</div>

<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal-box">
    <h2 id="modal-title"></h2>
    <pre id="modal-content"></pre>
    <button id="modal-close" onclick="closeModal(event)">Close</button>
  </div>
</div>

<div id="ship-modal-overlay" onclick="closeShipModal(event)">
  <div id="ship-modal-box">
    <h2 id="ship-modal-title"></h2>
    <div id="ship-modal-content"></div>
    <button id="ship-modal-close" onclick="closeShipModal(event)">Close</button>
  </div>
</div>

<script>
// Must exactly match server.py's ARCHIVE_BUCKET string - used to tell
// whether a bucket's "move" button should say "to Archive" or "back", and
// whether it should call /api/archive or /api/unarchive.
const ARCHIVE_BUCKET_KEY = "\u{1F4E5} ARCHIVE";

let currentData = { buckets: [] };
let selectedOrders = {};
// Which bucket detail panels are currently open, by detailId. Checked at
// render time so the periodic background refresh (every 15s) doesn't wipe
// out what the person had open - previously every renderBuckets() call
// rebuilt the grid from scratch and lost this, making buckets snap shut on
// their own. This resets naturally on page reload or a fresh login, since
// it's just an in-memory JS variable - no extra logic needed for those.
let openBuckets = new Set();

function bucketDetailId(key) {
  return "detail-" + btoa(unescape(encodeURIComponent(key))).replace(/[^a-zA-Z0-9]/g, "");
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function loadData() {
  const res = await fetch("/api/buckets");
  currentData = await res.json();
  document.getElementById("stat-orders").textContent = currentData.total_orders;
  document.getElementById("stat-buckets").textContent = currentData.total_buckets;

  const pollingText = currentData.is_polling ? "Refreshing now..." : "";
  const errorText = currentData.last_error ? `Last error: ${currentData.last_error}` : "";
  document.getElementById("status-line").textContent = errorText || pollingText;

  renderBuckets();
}

function renderBuckets() {
  const query = document.getElementById("search").value.trim().toUpperCase();
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.innerHTML = "";

  const filtered = currentData.buckets.filter(b => b.key.toUpperCase().includes(query));
  empty.style.display = filtered.length === 0 ? "block" : "none";

  filtered.forEach(bucket => {
    const card = document.createElement("div");
    card.className = "bucket-card";

    const detailId = bucketDetailId(bucket.key);
    const isShippable = !bucket.key.includes("BUNDLES") && !bucket.key.includes("NEEDS REVIEW");
    const isArchiveBucket = bucket.key === ARCHIVE_BUCKET_KEY;
    const isOpen = openBuckets.has(detailId);
    const selectedCount = selectedOrders[bucket.key]?.size || 0;

    const allSelected = isShippable && bucket.items.length > 0 &&
      bucket.items.every(item => selectedOrders[bucket.key]?.has(item.order_id));

    const selectAllHtml = isShippable ? `
      <div class="select-all-row" onclick="event.stopPropagation()">
        <label>
          <input type="checkbox" ${allSelected ? "checked" : ""} onclick="toggleSelectAll('${bucket.key}', this.checked)">
          Select all
        </label>
      </div>
    ` : "";

    const itemsHtml = bucket.items.slice(0, 200).map((item, idx) => {
      const clickAttr = `onclick="event.stopPropagation(); openNoteModal('${detailId}', ${idx})"`;
      const isChecked = selectedOrders[bucket.key]?.has(item.order_id) ? "checked" : "";
      const checkboxHtml = isShippable ? `<input type="checkbox" class="item-checkbox" ${isChecked} onclick="event.stopPropagation(); toggleOrderSelection('${bucket.key}', '${item.order_id}', this.checked, '${detailId}')">` : "";

      if (item.items_detail) {
        return `
          <div class="item-row" ${clickAttr}>
            ${checkboxHtml}<span class="order-id">Order ${item.order_id}</span>
            <span class="item-count">(${item.items_detail.length} items, ${item.total_units} units total - click for details)</span>
          </div>
        `;
      }

      const nameOrSku = item.name || item.sku || "";
      const colorPart = item.color ? ` - ${item.color}` : "";
      return `
        <div class="item-row" ${clickAttr}>
          ${checkboxHtml}<span class="order-id">Order ${item.order_id}</span> —
          <span class="field">${nameOrSku}</span>${colorPart},
          <span class="field">Size ${item.size || "?"}</span>
        </div>
      `;
    }).join("");

    // Print + Ship: exactly 2 buttons, both act on whatever is checked
    // (or everything, if "Select all" was used) - no separate "all" buttons.
    const actionsHtml = isShippable ? `
      <div class="action-row" onclick="event.stopPropagation()">
        <button class="secondary" onclick="printPackingSlipSelected('${bucket.key}')">
          Print packing slip (selected <span id="print-selected-count-${detailId}">${selectedCount}</span>)
        </button>
        <button class="ship-btn" id="ship-selected-btn-${detailId}" onclick="shipSelected('${bucket.key}', '${detailId}')">
          Ship selected (<span id="selected-count-${detailId}">${selectedCount}</span>)
        </button>
      </div>
    ` : "";

    // Archive / un-archive: same select-then-act pattern as ship/print,
    // just moving the order between "visible in its bucket" and "hidden in
    // Archive" instead of doing something to it. Only shown where
    // checkboxes exist at all (isShippable), same as the buttons above.
    const archiveActionHtml = isShippable ? (
      isArchiveBucket ? `
        <div class="action-row" onclick="event.stopPropagation()">
          <button class="secondary" onclick="moveSelectedBack('${bucket.key}', '${detailId}')">
            Move selected back
          </button>
        </div>
      ` : `
        <div class="action-row" onclick="event.stopPropagation()">
          <button class="secondary" onclick="moveSelectedToArchive('${bucket.key}', '${detailId}')">
            Move selected to Archive
          </button>
        </div>
      `
    ) : "";

    card.innerHTML = `
      <div class="row" onclick="toggleDetail('${detailId}')">
        <div class="bucket-name">${bucket.key}</div>
        <div class="bucket-count">${bucket.count}</div>
      </div>
      <div class="bucket-detail${isOpen ? " open" : ""}" id="${detailId}">
        ${selectAllHtml}
        ${itemsHtml}
        ${archiveActionHtml}
        ${actionsHtml}
      </div>
    `;
    grid.appendChild(card);
  });
}

function toggleDetail(id) {
  const el = document.getElementById(id);
  el.classList.toggle("open");
  if (el.classList.contains("open")) {
    openBuckets.add(id);
  } else {
    openBuckets.delete(id);
  }
}

function toggleOrderSelection(bucketKey, orderId, checked, detailId) {
  if (!selectedOrders[bucketKey]) selectedOrders[bucketKey] = new Set();
  if (checked) {
    selectedOrders[bucketKey].add(orderId);
  } else {
    selectedOrders[bucketKey].delete(orderId);
  }
  const count = selectedOrders[bucketKey].size;
  const shipCountSpan = document.getElementById("selected-count-" + detailId);
  if (shipCountSpan) shipCountSpan.textContent = count;
  const printCountSpan = document.getElementById("print-selected-count-" + detailId);
  if (printCountSpan) printCountSpan.textContent = count;
}

function toggleSelectAll(bucketKey, checked) {
  const bucket = currentData.buckets.find(b => b.key === bucketKey);
  if (!bucket) return;
  if (!selectedOrders[bucketKey]) selectedOrders[bucketKey] = new Set();

  if (checked) {
    bucket.items.forEach(item => selectedOrders[bucketKey].add(item.order_id));
  } else {
    selectedOrders[bucketKey].clear();
  }
  // Full re-render to keep every individual checkbox, both selected counts,
  // and this select-all box itself all in sync - the bucket stays open
  // since its detailId is already in openBuckets from being clicked into.
  renderBuckets();
}

function openNoteModal(detailId, itemIdx) {
  const bucket = currentData.buckets.find(b => bucketDetailId(b.key) === detailId);
  if (!bucket) return;
  const item = bucket.items[itemIdx];
  document.getElementById("modal-title").textContent = `Order ${item.order_id} - Full note`;
  document.getElementById("modal-content").textContent = item.full_note || "(no note text)";
  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal(event) {
  if (event.target.id === "modal-overlay" || event.target.id === "modal-close") {
    document.getElementById("modal-overlay").classList.remove("open");
  }
}

// --- Archive / un-archive: purely local server-side moves, no TikTok call
// happens, so a plain loadData() right after already reflects the change -
// no need for the slower refreshUntilCaughtUp() polling used after a real
// ship action. ---

async function moveSelectedToArchive(bucketKey, detailId) {
  const ids = Array.from(selectedOrders[bucketKey] || []);
  if (ids.length === 0) {
    alert("No orders selected - check the boxes next to the orders you want to move first.");
    return;
  }
  await fetch("/api/archive", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ order_ids: ids }),
  });
  if (selectedOrders[bucketKey]) selectedOrders[bucketKey].clear();
  await loadData();
}

async function moveSelectedBack(bucketKey, detailId) {
  const ids = Array.from(selectedOrders[bucketKey] || []);
  if (ids.length === 0) {
    alert("No orders selected - check the boxes next to the orders you want to move first.");
    return;
  }
  await fetch("/api/unarchive", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ order_ids: ids }),
  });
  if (selectedOrders[bucketKey]) selectedOrders[bucketKey].clear();
  await loadData();
}

// Re-fetching the FULL order queue from TikTok consistently takes real time
// (15-30+ seconds isn't unusual once there are hundreds of orders) - a
// refresh triggered right after an action (clicking "Refresh now", or
// finishing a ship) used to fire just 1 second later, which is almost
// always too early and shows the same stale data as before. This instead
// keeps checking back every couple seconds until the server's own
// last_updated timestamp is actually newer than what we had before the
// action - only then does it update the visible grid, so a shipped order
// reliably disappears once it truly should, without needing a disruptive
// recurring refresh the rest of the time.
async function refreshUntilCaughtUp(sinceTimestamp, maxWaitMs = 90000) {
  const start = Date.now();
  while (Date.now() - start < maxWaitMs) {
    const res = await fetch("/api/buckets");
    const data = await res.json();
    if (!sinceTimestamp || (data.last_updated && new Date(data.last_updated) > new Date(sinceTimestamp))) {
      currentData = data;
      document.getElementById("stat-orders").textContent = currentData.total_orders;
      document.getElementById("stat-buckets").textContent = currentData.total_buckets;
      const pollingText = currentData.is_polling ? "Refreshing now..." : "";
      const errorText = currentData.last_error ? `Last error: ${currentData.last_error}` : "";
      document.getElementById("status-line").textContent = errorText || pollingText;
      renderBuckets();
      return;
    }
    await new Promise(r => setTimeout(r, 2000));
  }
  // Gave up waiting for confirmation - still do a plain refresh rather than nothing.
  await loadData();
}

async function refreshNow() {
  const priorLastUpdated = currentData.last_updated;
  document.getElementById("status-line").textContent = "Refreshing - this can take up to 30 seconds for a full order re-check...";
  await fetch("/api/refresh", { method: "POST" });
  await refreshUntilCaughtUp(priorLastUpdated);
}

// --- Packing slips (client-side only - no API call needed, since every
// field it needs is already sitting in currentData from the last poll) ---

function buildPackingSlipLines(bucket, orderIds) {
  let items = bucket.items;
  if (orderIds) {
    const idSet = new Set(orderIds);
    items = items.filter(item => idSet.has(item.order_id));
  }

  const lines = [];
  items.forEach(item => {
    if (item.items_detail) {
      // Bundled/multi-line order - one packing-slip line per item inside it,
      // each with its own stored quantity.
      item.items_detail.forEach(detail => {
        lines.push({
          order_id: item.order_id,
          name: detail.name || detail.sku || "",
          color: detail.color || "",
          sku: detail.sku || "",
          size: detail.size || "",
          qty: detail.qty || 1,
        });
      });
    } else {
      lines.push({
        order_id: item.order_id,
        name: item.name || item.sku || "",
        color: item.color || "",
        sku: item.sku || "",
        size: item.size || "",
        qty: 1,
      });
    }
  });
  return lines;
}

function printPackingSlip(bucketKey, orderIds) {
  const bucket = currentData.buckets.find(b => b.key === bucketKey);
  if (!bucket) return;

  const lines = buildPackingSlipLines(bucket, orderIds);
  if (lines.length === 0) {
    alert("No orders to include in this packing slip.");
    return;
  }

  const orderCount = orderIds ? orderIds.length : bucket.items.length;

  const rowsHtml = lines.map(l => `
    <tr>
      <td>${escapeHtml(l.order_id)}</td>
      <td>${escapeHtml(l.name)}</td>
      <td>${escapeHtml(l.color)}</td>
      <td>${escapeHtml(l.sku)}</td>
      <td>${escapeHtml(l.size)}</td>
      <td>${l.qty}</td>
    </tr>
  `).join("");

  const html = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Packing Slip - ${escapeHtml(bucketKey)}</title>
      <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; color: #1a1d23; }
        h1 { font-size: 18px; margin: 0 0 4px 0; }
        .meta { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e3e5e9; font-size: 13px; }
        th { background: #f6f7f9; text-transform: uppercase; font-size: 11px; color: #6b7280; letter-spacing: 0.03em; }
        @media print { body { padding: 0; } }
      </style>
    </head>
    <body>
      <h1>Packing Slip — ${escapeHtml(bucketKey)}</h1>
      <div class="meta">${lines.length} line item(s) across ${orderCount} order(s) — generated ${new Date().toLocaleString()}</div>
      <table>
        <thead>
          <tr><th>Order #</th><th>Style / Name</th><th>Color</th><th>SKU</th><th>Size</th><th>Qty</th></tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </body>
    </html>
  `;

  const win = window.open("", "_blank");
  if (!win) {
    alert("Your browser blocked the new tab - please allow popups for this site and try again.");
    return;
  }
  win.document.write(html);
  win.document.close();
  // Triggering print from the PARENT window's script, rather than embedding
  // a script tag inside the string above, avoids a real HTML-parsing trap:
  // a browser (and any code editor's HTML parser) treats the literal
  // closing-script-tag text as ending the CURRENT script block the instant
  // it appears - even sitting inside a quoted string or a comment. Writing
  // that closing tag literally inside this template literal would have
  // prematurely ended this page's own main script block partway through
  // the file, silently breaking every function defined after it.
  win.onload = () => win.print();
}

function printPackingSlipSelected(bucketKey) {
  const ids = Array.from(selectedOrders[bucketKey] || []);
  if (ids.length === 0) {
    alert("No orders selected - check the boxes next to the orders you want to include first.");
    return;
  }
  printPackingSlip(bucketKey, ids);
  selectedOrders[bucketKey].clear();
  renderBuckets();
}

async function doShip(bucketKey, detailId, orderIds, btnId) {
  const count = orderIds.length;
  const confirmed = confirm(
    `This will purchase REAL shipping labels for ${count} order(s) in "${bucketKey}".\n\n` +
    `This spends real money and cannot be undone. Continue?`
  );
  if (!confirmed) return;

  const priorLastUpdated = currentData.last_updated;
  const btn = document.getElementById(btnId);
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Starting...";

  try {
    const body = { bucket_key: bucketKey, order_ids: orderIds };

    const startRes = await fetch("/api/ship_bucket", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const startData = await startRes.json();

    if (startData.error) {
      alert("Error: " + startData.error);
      return;
    }

    const jobId = startData.job_id;
    btn.textContent = "Shipping in progress - this can take a minute for large batches, please wait...";

    let data;
    while (true) {
      await new Promise(r => setTimeout(r, 2000));
      const statusRes = await fetch(`/api/job_status/${jobId}`);
      const statusData = await statusRes.json();
      if (statusData.status === "done") {
        data = statusData.response;
        break;
      }
    }

    if (data.error) {
      alert("Error: " + data.error);
      return;
    }

    showShipResults(bucketKey, data);
    if (selectedOrders[bucketKey]) selectedOrders[bucketKey].clear();
  } catch (err) {
    alert("Something went wrong: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
    refreshUntilCaughtUp(priorLastUpdated);
  }
}

async function shipSelected(bucketKey, detailId) {
  const ids = Array.from(selectedOrders[bucketKey] || []);
  if (ids.length === 0) {
    alert("No orders selected - check the boxes next to the orders you want to ship first.");
    return;
  }
  await doShip(bucketKey, detailId, ids, "ship-selected-btn-" + detailId);
}

function showShipResults(bucketKey, data) {
  const results = data.results;
  const succeeded = results.filter(r => r.success);
  const failed = results.filter(r => !r.success);

  document.getElementById("ship-modal-title").textContent =
    `${bucketKey} - ${succeeded.length} shipped, ${failed.length} failed`;

  let combinedHtml = "";
  if (data.combined_pdf_url) {
    combinedHtml = `
      <div style="margin-bottom:16px; padding:12px; background:var(--accent-light); border-radius:8px;">
        <a href="${data.combined_pdf_url}" target="_blank" style="font-size:14px;">
          Download all ${data.combined_pdf_page_count} label(s) as one PDF
        </a>
        <div style="color:var(--muted); font-size:12px; margin-top:4px;">One file, all labels as separate pages - print it once.</div>
      </div>
    `;
  }

  const rowsHtml = results.map(r => {
    if (r.success) {
      return `
        <div class="ship-result-row success">
          Order ${r.order_id} - shipped (tracking: ${r.tracking_number})
          <br><a href="${r.doc_url}" target="_blank">Open individual label PDF</a>
          <span style="color:var(--muted)"> (link expires in 24h)</span>
        </div>
      `;
    }
    return `
      <div class="ship-result-row failure">
        Order ${r.order_id} - failed at "${r.stage || "unknown"}" step: ${r.error || "Unknown error"}
      </div>
    `;
  }).join("");

  document.getElementById("ship-modal-content").innerHTML = combinedHtml + rowsHtml;
  document.getElementById("ship-modal-overlay").classList.add("open");
}

function closeShipModal(event) {
  if (event.target.id === "ship-modal-overlay" || event.target.id === "ship-modal-close") {
    document.getElementById("ship-modal-overlay").classList.remove("open");
  }
}

loadData();
// Auto-refresh removed on purpose - it was rebuilding the entire bucket
// grid every 15 seconds, which reset scroll position inside any open
// bucket back to the top. Data now only refreshes when "Refresh now" is
// clicked, or automatically right after a ship action - both now wait for
// the server to genuinely confirm it's caught up (see refreshUntilCaughtUp)
// rather than guessing at a fixed delay.
</script>
